---
services:
  atuin:
    image: ghcr.io/atuinsh/atuin:latest
    command: start
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - underlab_atuin_config:/config
    environment:
      ATUIN_HOST: "0.0.0.0"
      ATUIN_PORT: 8888
      ATUIN_OPEN_REGISTRATION: "false"
      ATUIN_DB_URI: "postgres://${ATUIN_DB_USERNAME}:${ATUIN_DB_PASSWORD}@postgres/${ATUIN_DB_NAME}"
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - underlab_atuin_database:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: "${ATUIN_DB_USERNAME}"
      POSTGRES_PASSWORD: "${ATUIN_DB_PASSWORD}"
      POSTGRES_DB: "${ATUIN_DB_NAME}"

volumes:
  underlab_atuin_config:
    external: true
  underlab_atuin_database:
    external: true
