---
services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: frigate
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    shm_size: "512mb"
    ports:
      - "8971:8971"
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"
    environment:
      - FRIGATE_CAMERA_01_PASSWORD=${FRIGATE_CAMERA_01_PASSWORD}
      - FRIGATE_CAMERA_02_PASSWORD=${FRIGATE_CAMERA_02_PASSWORD}
    volumes:
      - ./config:/config
      - underlab_frigate_media:/media/frigate
      - /etc/localtime:/etc/localtime:ro
    tmpfs:
      - /tmp/cache:size=1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  underlab_frigate_media:
    external: true
