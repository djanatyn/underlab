---
version: "3.8"

services:
  plumio:
    image: ghcr.io/albertasaftei/plumio:2.11.0
    container_name: plumio
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - BACKEND_INTERNAL_PORT=3001
      - DOCUMENTS_PATH=/data/documents
      - DB_PATH=/data/plumio.db
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ALLOWED_ORIGINS=https://${FRONTEND_URL}
      - ENABLE_ENCRYPTION=true
      - APP_URL=${APP_URL}
    volumes:
      - underlab_plumio_data:/data
    networks:
      - plumio-network
      - proxy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3001/api/health",
        ]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    labels:
      - traefik.docker.network=proxy
      - traefik.enable=true
      - traefik.http.routers.plumio.rule=Host(`wiki.pi.djan.org`)
      - traefik.http.routers.plumio.entrypoints=websecure
      - traefik.http.routers.plumio.tls.certresolver=gandi
      - traefik.http.services.plumio.loadbalancer.server.port=3000

