---
services:
  wastebin:
    image: quxfoo/wastebin:3.7.2-arm64
    restart: always
    environment:
      - WASTEBIN_DATABASE_PATH=/data/state.db
    ports:
      - "8088:8088"
    volumes:
      - underlab_wastebin_data:/data
    labels:
      - traefik.docker.network=proxy
      - traefik.enable=true
      - traefik.http.routers.wastebin.rule=Host(`wastebin.pi.djan.org`)
      - traefik.http.routers.wastebin.entrypoints=websecure
      - traefik.http.routers.wastebin.tls.certresolver=gandi
      - traefik.http.services.wastebin.loadbalancer.server.port=8088
    networks:
      - default
      - proxy

networks:
  proxy:
    external: true

volumes:
  underlab_wastebin_data:
    external: true
