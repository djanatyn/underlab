[package]
name = "underlab"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
blake3 = "1.8.5"
clap = { version = "4.6.5", features = ["derive", "string"] }
duct = "1.1.1"
flate2 = "1.1.10"
gix = "0.86.0"
insta = "1.48.0"
kdl = "6.7.1"
nix = { version = "0.31.3", features = ["fs", "user"] }
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.2.0"
strum = { version = "0.28.0", features = ["derive"] }
tar = "0.4.46"
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["formatting", "macros"] }
walkdir = "2.5.0"
